[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pplx-export"
version = "0.1.0"
description = "Perplexity conversation archive & export toolkit"
readme = "pplx_export/README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "browser_cookie3>=0.19",
    "tomlkit>=0.15.1",
]

[project.scripts]
pplx-export = "pplx_export.cli:main"
pplx-ask = "pplx_export.ask_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pplx_export"]

[dependency-groups]
dev = [
    "pyyaml>=6",
    "pytest>=9.1.1",
]
docs = [
    "mkdocs-material>=9",
    "mkdocs-redirects==1.2.2",
    "mkdocs-static-i18n>=1",
]

[tool.uv]
default-groups = ["dev", "docs"]
