name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      changed_base:
        description: Exact ancestor SHA used for bilingual changed-pair checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check sensitive paths are not tracked
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)[.]cookies[.]json$|^web_archive/' || true)"
          if [[ -n "${tracked}" ]]; then
            echo "::error title=Sensitive path tracked::${tracked}"
            exit 1
          fi
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Check dependency lock
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Audit documentation contracts
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ inputs.changed_base }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) changed_base="${PR_BASE_SHA}" ;;
            push) changed_base="${PUSH_BASE_SHA}" ;;
            workflow_dispatch) changed_base="${MANUAL_BASE_SHA}" ;;
            *)
              echo "::error title=Unsupported quality event::${EVENT_NAME}"
              exit 2
              ;;
          esac
          if [[ ! "${changed_base}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=Invalid changed base::Expected an exact 40-character commit SHA"
            exit 2
          fi
          if ! git cat-file -e "${changed_base}^{commit}" ||
             ! git merge-base --is-ancestor "${changed_base}" HEAD; then
            echo "::error title=Unusable changed base::The base must be an available ancestor of HEAD"
            exit 2
          fi
          args=(--format github --machine-mode allow-stale)
          args+=(--changed-base "${changed_base}")
          uv run python scripts/audit_docs.py "${args[@]}"
      - name: Check simulated fixture residue
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/scrub-check.log"
          uv run python tests/scrub_fixtures.py --check | tee "${log}"
          unexecuted="$(sed -n 's/^unexecuted-check-classes: //p' "${log}")"
          if [[ -n "${unexecuted}" && "${unexecuted}" != "none" ]]; then
            {
              echo "## Simulated fixture residue check"
              echo ""
              echo "Unexecuted pattern classes on this runner: \`${unexecuted}\`"
              echo ""
              echo "Green status covers only the executed classes; identity and content replacement sources are unavailable in CI."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Run sensitive core boundary targeted tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ inputs.changed_base }}
        run: |
          set -euo pipefail
          # Mechanized mapping of the sensitive boundary declared in
          # pplx_export/core/AGENTS.md: any change under pplx_export/core/**
          # (auth, cookies, HTTP transports, credential caching, transport
          # construction) must run the targeted offline sensitive-path tests
          # before the full suite. This never replaces the full gate below.
          boundary="pplx_export/core/AGENTS.md"
          case "${EVENT_NAME}" in
            pull_request) changed_base="${PR_BASE_SHA}" ;;
            push) changed_base="${PUSH_BASE_SHA}" ;;
            workflow_dispatch) changed_base="${MANUAL_BASE_SHA}" ;;
            *)
              echo "::error title=Unsupported quality event::${EVENT_NAME}"
              exit 2
              ;;
          esac
          if [[ ! "${changed_base}" =~ ^[0-9a-fA-F]{40}$ ]] ||
             ! git cat-file -e "${changed_base}^{commit}" ||
             ! git merge-base --is-ancestor "${changed_base}" HEAD; then
            echo "::error title=Unusable changed base::The base must be an available ancestor of HEAD"
            exit 2
          fi
          mapfile -t core_changes < <(
            git diff --name-only "${changed_base}" HEAD -- 'pplx_export/core/' || true
          )
          if [[ "${#core_changes[@]}" -eq 0 ]]; then
            echo "::notice title=Sensitive core boundary::No pplx_export/core/** changes in this diff; targeted sensitive-path tests not required (mechanized mapping of ${boundary})."
            {
              echo "## Sensitive core boundary (${boundary})"
              echo ""
              echo "No \`pplx_export/core/**\` changes in this diff; the targeted sensitive-path gate is not triggered."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "::notice title=Sensitive core boundary::pplx_export/core/** changed; running the targeted auth/cookies/http tests as the mechanized mapping of ${boundary}."
          targeted_tests=(
            tests/test_credential.py
            tests/test_cookie_profiles.py
            tests/test_fix_n04_cookies.py
            tests/test_fix_n05_n06_n09.py
          )
          {
            echo "## Sensitive core boundary (${boundary})"
            echo ""
            echo "Detected \`pplx_export/core/**\` changes; running the targeted auth/cookies/http tests declared by the boundary before the full suite:"
            echo ""
            printf -- '- %s\n' "${core_changes[@]}"
            echo ""
            printf 'Targeted tests: \`%s\`\n' "${targeted_tests[*]}"
          } >> "${GITHUB_STEP_SUMMARY}"
          uv run pytest -q "${targeted_tests[@]}"
      - name: Run tests
        run: uv run pytest -q
      - name: Build all configured documentation locales strictly
        run: uv run mkdocs build --strict
